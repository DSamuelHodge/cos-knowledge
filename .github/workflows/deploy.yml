name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # GH Pages fallback artifact
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
      # Primary: Cloudflare Pages advanced mode — the Blume server worker rides as
      # _worker.js with the ASSETS binding (MCP /mcp for agents + content
      # negotiation). REVOKED: worker custom-domain/zone-route APIs reject the
      # repo's key auth (403/10405), so the Pages project stays the host.
      - name: Deploy to Cloudflare Pages (advanced worker)
        run: |
          cp dist/server/blume-worker.mjs dist/client/_worker.js
          npx wrangler pages deploy dist/client --project-name=cos-knowledge --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4